name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: murad123456
      KS_ALIAS: murad
      KEY_PASS: murad123456
      VCODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Stamp build + copy site into the app
        run: |
          sed -i "s/__BUILD__/apk-${VCODE}/g" sw.js config.js
          mkdir -p android-app/www
          cp -r index.html config.js sw.js manifest.webmanifest assets android-app/www/

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Native uninstall plugin (إلغاء التثبيت لما حالة البرنامج = حذف)
        run: |
          D=android-app/android/app/src/main/java/com/muradpharmacy/app
          mkdir -p "$D"
          cp android-app/native/*.java "$D/"
          M=android-app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />\n    <application#' $M

      - name: Permissions (camera) + launcher icons
        run: |
          M=android-app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          pip install pillow
          python3 tools/make_android_icons.py android-app/android/app/src/main/res

      - name: Restore signing key from cache
        id: ks-cache
        uses: actions/cache@v4
        with:
          path: ~/murad-release.jks
          key: murad-keystore-v1

      - name: Generate signing key (first time only)
        if: steps.ks-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore ~/murad-release.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 -alias murad \
            -storepass murad123456 -keypass murad123456 \
            -dname "CN=Murad Pharmacy, O=Murad, C=EG"

      - name: Signing and version
        run: |
          echo "KS_PATH=$HOME/murad-release.jks" >> "$GITHUB_ENV"
          cat >> android-app/android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("VCODE"))
                  versionName "1.0." + System.getenv("VCODE")
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_PATH"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias System.getenv("KS_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          GRADLE

      - name: Cache Gradle download
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-v1

      - name: Build signed APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          sed -i 's/networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon && break
            echo "Attempt $i failed"
            [ "$i" = "3" ] && exit 1
            sleep 20
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Murad-Pharmacy-apk
          path: android-app/android/app/build/outputs/apk/release/*.apk
